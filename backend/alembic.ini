[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# Uncomment this if you want Alembic to use a fixed database URL.
# Your env.py currently reads DATABASE_URL from .env, so this can remain unused.
# sqlalchemy.url = postgresql+psycopg://username:password@localhost:5432/coe_management


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s